workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - validate
  - build
  - deploy

.ci_rules:
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  extends: .ci_rules
  stage: test
  image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv /opt/venv
    - . /opt/venv/bin/activate
    - pip install -r requirements-dev.txt
  script:
    - pytest -q

helm-lint:
  extends: .ci_rules
  stage: validate
  image:
    name: alpine/helm:3.16.4@sha256:9b25e60ae264940b276e32866d37e3088e70c4e2d1784b964dc3f90346281a74
    entrypoint: [""]
  script:
    - helm lint helm
    - |
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE:-confapi}:${CI_COMMIT_SHORT_SHA}"
      helm template sandbox ./helm \
        --set image.repository="${CI_REGISTRY_IMAGE:-confapi}" \
        --set image.tag="${CI_COMMIT_SHORT_SHA}" \
        --set image.pullPolicy=Always \
        --set environment=dev \
        --set fullnameOverride=confapi \
        --set imagePullSecrets[0].name=gitlab-registry \
        >/tmp/rendered.yaml
      grep -q "containerPort: 8080" /tmp/rendered.yaml
      grep -q "targetPort: http" /tmp/rendered.yaml
      grep -q "name: confapi" /tmp/rendered.yaml
      grep -q "path: /ready" /tmp/rendered.yaml
      grep -F "image: \"${EXPECTED_IMAGE}\"" /tmp/rendered.yaml
      grep -F "app.kubernetes.io/version: \"${CI_COMMIT_SHORT_SHA}\"" /tmp/rendered.yaml

terraform-validate:
  extends: .ci_rules
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8@sha256:18f9986038bbaf02cf49db9c09261c778161c51dcc7fb7e355ae8938459428cd
    entrypoint: [""]
  script:
    - cd terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

build-job:
  extends: .ci_rules
  stage: build
  image: docker:27
  needs:
    - job: test
      artifacts: false
    - job: helm-lint
      artifacts: false
    - job: terraform-validate
      artifacts: false
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      if [ -n "${EXTRA_CA_CERT:-}" ]; then
        mkdir -p certs
        printf '%s\n' "$EXTRA_CA_CERT" > certs/extra-ca.crt
      fi
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.16.4@sha256:732b9752c447ce91cbd908c15f9f450e2d94cd3cfec47ce1072956df532cb0bf
    entrypoint: [""]
  environment:
    name: sandbox
  needs:
    - job: test
      artifacts: false
    - job: helm-lint
      artifacts: false
    - job: terraform-validate
      artifacts: false
    - job: build-job
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - chmod 600 kubeconfig
    - export KUBECONFIG="$PWD/kubeconfig"
    - helm version
    - kubectl version --client
  script:
    - |
      PULL_USER="${CI_DEPLOY_USER:-$CI_REGISTRY_USER}"
      PULL_PASSWORD="${CI_DEPLOY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
      if [ -z "${CI_DEPLOY_PASSWORD:-}" ]; then
        echo "WARNING: CI_DEPLOY_PASSWORD is unset. The cluster pull secret will use the job token, which expires when this job ends. Create a GitLab Deploy Token named gitlab-deploy-token with read_registry."
      fi
      kubectl create namespace sandbox --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret docker-registry gitlab-registry \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$PULL_USER" \
        --docker-password="$PULL_PASSWORD" \
        --namespace sandbox \
        --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install sandbox ./helm \
        --namespace sandbox \
        --create-namespace \
        --set image.repository="$CI_REGISTRY_IMAGE" \
        --set image.tag="$CI_COMMIT_SHORT_SHA" \
        --set image.pullPolicy=Always \
        --set environment="${DEPLOY_ENVIRONMENT:-dev}" \
        --set fullnameOverride=confapi \
        --set imagePullSecrets[0].name=gitlab-registry \
        --wait \
        --timeout 180s
    - helm status sandbox --namespace sandbox
